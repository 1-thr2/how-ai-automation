# CD (Continuous Deployment) 파이프라인
# main 브랜치에 머지되면 자동으로 Vercel에 배포

name: Deploy to Production

# main 브랜치에 푸시될 때만 실행
on:
  push:
    branches: [main]

  # 수동 배포도 가능
  workflow_dispatch:

# 동시 배포 방지
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # 배포 전 검증
  pre-deploy-check:
    name: 배포 전 검증
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      # 빌드 테스트 (프로덕션 설정)
      - name: 프로덕션 빌드 테스트
        run: npm run build
        env:
          NODE_ENV: production
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

      # 테스트 실행
      - name: 테스트 실행
        run: npm test
        env:
          NODE_ENV: test

  # Vercel 배포
  deploy:
    name: Vercel 배포
    runs-on: ubuntu-latest
    needs: pre-deploy-check

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # Vercel CLI 설치
      - name: Vercel CLI 설치
        run: npm install -g vercel@latest

      # Vercel 프로젝트 링크
      - name: Vercel 프로젝트 정보 가져오기
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Vercel 빌드
      - name: Vercel 빌드
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Vercel 배포
      - name: Vercel 프로덕션 배포
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "🚀 배포 완료: $DEPLOY_URL"

      # 배포 URL 코멘트 (PR이 있을 경우)
      - name: 배포 URL 알림
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 프로덕션 배포 완료!\n\n배포 URL: ${{ steps.deploy.outputs.deploy_url }}'
            })

  # 배포 후 검증
  post-deploy-check:
    name: 배포 후 검증
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      # 헬스 체크
      - name: 웹사이트 헬스 체크
        run: |
          echo "🏥 헬스 체크 시작..."
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://your-domain.vercel.app || echo "000")
            echo "시도 $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ 헬스 체크 성공!"
              exit 0
            fi
            sleep 10
          done
          echo "❌ 헬스 체크 실패"
          exit 1

  # 배포 알림
  notify:
    name: 배포 알림
    runs-on: ubuntu-latest
    needs: [deploy, post-deploy-check]
    if: always()

    steps:
      # Slack 알림 (옵션)
      - name: Slack 알림
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ needs.post-deploy-check.result }}
          text: |
            배포 상태: ${{ needs.post-deploy-check.result }}
            커밋: ${{ github.event.head_commit.message }}
            작성자: ${{ github.actor }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      # Discord 알림 (옵션)
      - name: Discord 알림
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.post-deploy-check.result }}
          title: "프로덕션 배포"
          description: |
            커밋: ${{ github.event.head_commit.message }}
            작성자: ${{ github.actor }}
