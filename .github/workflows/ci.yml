# CI (Continuous Integration) 파이프라인
# 코드가 푸시되거나 Pull Request가 생성될 때마다 자동 실행

name: CI

# 언제 실행할지 설정
on:
  # main 브랜치에 푸시될 때
  push:
    branches: [main, develop]

  # Pull Request가 생성되거나 업데이트될 때
  pull_request:
    branches: [main, develop]

  # 수동 실행 가능
  workflow_dispatch:

# 동시 실행 제어 (같은 브랜치에서는 최신 것만 실행)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 작업 정의
jobs:
  # Job 1: 타입 체크 및 린트
  lint:
    name: 린트 및 타입 체크
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # 2. Node.js 설정
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. 의존성 설치
      - name: 의존성 설치
        run: npm ci

      # 4. ESLint 실행
      - name: ESLint 검사
        run: npm run lint
        continue-on-error: true # 에러가 있어도 계속 진행

      # 5. TypeScript 타입 체크
      - name: TypeScript 타입 체크
        run: npm run type-check
        continue-on-error: true # 에러가 있어도 계속 진행

      # 6. Prettier 포맷 체크
      - name: 코드 포맷 체크
        run: npx prettier --check .
        continue-on-error: true

  # Job 2: 테스트
  test:
    name: 테스트 실행
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      # 테스트 실행
      - name: 단위 테스트
        run: npm test
        env:
          NODE_ENV: test

      # 테스트 커버리지 생성
      - name: 테스트 커버리지
        run: npm run test:coverage
        continue-on-error: true

      # 커버리지 리포트 업로드 (옵션)
      - name: 커버리지 업로드
        uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

  # Job 3: 빌드 테스트
  build:
    name: 빌드 테스트
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      # Next.js 빌드
      - name: Next.js 빌드
        run: npm run build
        env:
          # 빌드에 필요한 환경변수 (테스트용 더미 값)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-dummy-key-for-build' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://test.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJtest' }}

      # 빌드 결과물 크기 확인
      - name: 빌드 크기 분석
        run: |
          echo "📦 빌드 결과물 크기:"
          du -sh .next
          echo ""
          echo "📊 주요 번들 크기:"
          du -sh .next/static/* | sort -h

  # Job 4: 보안 검사
  security:
    name: 보안 취약점 검사
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # npm audit으로 취약점 검사
      - name: NPM 보안 감사
        run: npm audit --audit-level=moderate
        continue-on-error: true

      # 의존성 취약점 체크
      - name: 의존성 취약점 체크
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # Job 5: 결과 요약
  summary:
    name: CI 결과 요약
    runs-on: ubuntu-latest
    needs: [lint, test, build, security]
    if: always()

    steps:
      - name: CI 결과 요약
        run: |
          echo "## 🚀 CI 파이프라인 완료"
          echo ""
          echo "### 결과:"
          echo "- ✅ 린트: ${{ needs.lint.result }}"
          echo "- ✅ 테스트: ${{ needs.test.result }}"
          echo "- ✅ 빌드: ${{ needs.build.result }}"
          echo "- ✅ 보안: ${{ needs.security.result }}"
          echo ""
          echo "### 다음 단계:"
          echo "모든 체크가 통과하면 배포 준비 완료!"
